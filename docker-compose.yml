version: '3.7'

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_STAT: 1
      TELEGRAM_LOCAL: 1
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - ./shared-data:/shared
    ports:
      - "8082:8082"

  python-bot:
    build: ${PATH_TO_BOT} # Путь к папке с вашим Python-ботом, где находится Dockerfile
    container_name: python_bot
    depends_on:
      - telegram-bot-api
    environment:
      TELEGRAM_TOKEN: ${BOT_TOKEN}
      TELEGRAM_API_URL: "http://telegram-bot-api:8081"
    volumes:
      - ./shared-data:/shared

volumes:
  telegram-bot-api-data:
