services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_STAT: 1
      TELEGRAM_LOCAL: 1
      # Uncommend in case you need to debug
      # TELEGRAM_VERBOSITY: 1
    env_file:
      - .env
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - ./shared-data:/shared
    ports:
      - "8082:8082"

  python-bot:
    build: .
    container_name: python_bot
    depends_on:
      - telegram-bot-api
    environment:
      TELEGRAM_API_URL: "http://telegram-bot-api:8081"
    env_file:
      - .env
    volumes:
      - ./shared-data:/shared
      - .:/app

volumes:
  telegram-bot-api-data:
